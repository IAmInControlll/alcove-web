               c -18,-5 -36,4 -40,22
               c -16,-4 -34,6 -37,22
               c -13,3 -19,16 -11,26
               c -6,11 2,23 15,25
               c 4,13 23,19 40,13
               c 10,12 33,13 46,3
               c 17,8 40,3 46,-12
               c 17,2 30,-10 23,-25
               c 6,-13 -5,-30 -21,-32
               c -4,-17 -23,-27 -40,-18
               c -7,-15 -31,-20 -45,-9 z"/>
