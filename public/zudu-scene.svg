        <path d="M-2,55 q-18,8 -26,-2 q14,6 24,-2" fill="#558b2f"/>
        <ellipse cx="-18" cy="57" rx="14" ry="8" fill="#558b2f" transform="rotate(-30 -18 57)"/>
        <g>
          <ellipse cx="0" cy="-22" rx="16" ry="22" fill="#e53935"/>
          <ellipse cx="21" cy="-7" rx="22" ry="16" fill="#e53935"/>
          <ellipse cx="13" cy="18" rx="16" ry="22" fill="#e53935" transform="rotate(20 13 18)"/>
          <ellipse cx="-13" cy="18" rx="16" ry="22" fill="#e53935" transform="rotate(-20 -13 18)"/>
          <ellipse cx="-21" cy="-7" rx="22" ry="16" fill="#e53935"/>
