<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <defs>
    <filter id="crayon" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Sky background (smooth, no filter) -->
  <rect x="0" y="0" width="1920" height="1080" fill="#b8d8f0"/>

  <!-- Crayon-drawn scene -->
  <g filter="url(#crayon)">

    <!-- Sun (upper left) -->
    <g>
      <circle cx="210" cy="190" r="95" fill="#ffd54f"/>
      <g fill="none" stroke="#ffb300" stroke-width="9" stroke-linecap="round">
        <path d="M210,70 L212,20"/>
        <path d="M310,120 L350,95"/>
        <path d="M335,190 L390,188"/>
        <path d="M310,260 L350,290"/>
        <path d="M210,310 L212,360"/>
        <path d="M110,260 L70,290"/>
        <path d="M85,190 L30,188"/>
        <path d="M110,120 L70,95"/>
      </g>
    </g>

    <!-- Clouds -->
    <g fill="#f0f8ff">
      <!-- Cloud 1 -->
      <path d="M540,160
               c -30,-5 -55,10 -60,35
               c -25,-8 -55,5 -60,30
               c -20,5 -30,25 -20,40
               c -10,15 0,35 20,38
               c 5,20 35,30 60,22
               c 15,18 50,20 70,5
               c 25,12 60,5 70,-18
               c 25,5 45,-15 38,-38
               c 10,-20 -5,-45 -30,-48
               c -5,-25 -35,-40 -60,-28
               c -10,-22 -45,-30 -68,-15 z"/>
      <!-- Cloud 2 -->
      <path d="M1180,120
               c -25,-8 -50,5 -55,28
               c -22,-6 -48,8 -52,28
               c -18,4 -26,22 -16,36
               c -8,14 2,32 20,34
               c 6,18 32,26 54,18
               c 14,16 46,18 64,4
               c 22,10 54,4 62,-16
               c 22,4 40,-14 32,-34
               c 8,-18 -6,-40 -28,-42
               c -6,-22 -32,-36 -54,-24
               c -10,-20 -42,-26 -62,-12 z"/>
      <!-- Cloud 3 -->
      <path d="M1620,220
               c -22,-6 -44,4 -48,25
               c -20,-5 -42,7 -46,25
               c -16,3 -23,20 -14,32
               c -7,13 2,28 18,30
               c 5,16 28,23 48,16
               c 12,14 40,16 56,4
               c 20,9 48,4 56,-14
               c 20,3 36,-12 28,-30
               c 7,-16 -6,-36 -25,-38
               c -5,-20 -28,-32 -48,-22
               c -9,-18 -38,-24 -55,-10 z"/>
