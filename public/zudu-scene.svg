          <ellipse cx="12" cy="17" rx="15" ry="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" transform="rotate(18 12 17)"/>
          <ellipse cx="-12" cy="17" rx="15" ry="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" transform="rotate(-18 -12 17)"/>
          <ellipse cx="-19" cy="-6" rx="20" ry="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
        </g>
        <circle cx="0" cy="0" r="12" fill="#ffc107"/>
