      <path d="M120,855 l4,-22 m-8,18 l-6,-16 m14,16 l8,-18"/>
      <path d="M340,848 l4,-20 m-8,16 l-6,-14 m14,14 l8,-16"/>
      <path d="M560,852 l4,-22 m-8,18 l-6,-16 m14,16 l8,-18"/>
      <path d="M780,846 l4,-20 m-8,16 l-6,-14 m14,14 l8,-16"/>
      <path d="M1000,850 l4,-22 m-8,18 l-6,-16 m14,16 l8,-18"/>
