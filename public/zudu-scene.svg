             q80,-25 160,-6
             q90,-28 180,-4
             q85,-26 170,-8
             q95,-24 190,-5
             q80,-28 160,-7
             q90,-26 180,-6
             q85,-24 170,-5
             q95,-22 190,-7
             q80,-26 160,-5
             q90,-24 180,-6
