          <ellipse cx="8" cy="11" rx="10" ry="14" fill="#ffeb3b" transform="rotate(14 8 11)"/>
          <ellipse cx="-8" cy="11" rx="10" ry="14" fill="#ffeb3b" transform="rotate(-14 -8 11)"/>
          <ellipse cx="-13" cy="-4" rx="14" ry="10" fill="#ffeb3b"/>
