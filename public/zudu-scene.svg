      <g transform="translate(1480,815) rotate(6)">
        <path d="M0,12 q2,40 0,80" fill="none" stroke="#558b2f" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="13" cy="42" rx="12" ry="7" fill="#558b2f" transform="rotate(36 13 42)"/>
        <g>
          <ellipse cx="0" cy="-15" rx="12" ry="16" fill="#ec407a"/>
